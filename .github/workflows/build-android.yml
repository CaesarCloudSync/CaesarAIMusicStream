name: Build Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Node.js v16
        uses: actions/setup-node@v4
        with:
          node-version: '16'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Determine Version Label
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "label=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          else
            echo "label=latest" >> $GITHUB_OUTPUT
          fi

      - name: Build Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Rename APK with version label
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk \
             android/app/build/outputs/apk/release/CaesarAIMusic-${{ steps.version.outputs.label }}.apk

      - name: Get Commit Message
        id: commit_info
        run: |
          echo "subject=$(git log -1 --format=%s)" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact (CI)
        uses: actions/upload-artifact@v4
        with:
          name: CaesarAIMusic-${{ steps.version.outputs.label }}
          path: android/app/build/outputs/apk/release/CaesarAIMusic-${{ steps.version.outputs.label }}.apk
          if-no-files-found: error

      - name: Publish to GitHub Releases (tags only)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: ncipollo/release-action@v1
        with:
          artifacts: "android/app/build/outputs/apk/release/CaesarAIMusic-${{ steps.version.outputs.label }}.apk"
          tag: ${{ github.ref_name }}
          name: "CaesarAIMusicStream ${{ github.ref_name }}"
          body: |
            **Release:** ${{ github.ref_name }}
            **Commit:** ${{ steps.commit_info.outputs.subject }}
          allowUpdates: false
          makeLatest: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub Releases (main branch → latest)
        if: github.event_name == 'push' && github.ref == 'refs/heads/CaesarAIMusicStreamV0-STABLE'
        uses: ncipollo/release-action@v1
        with:
          artifacts: "android/app/build/outputs/apk/release/CaesarAIMusic-latest.apk"
          tag: "latest"
          name: "CaesarAIMusicStream latest"
          body: "Automated build of commit: ${{ steps.commit_info.outputs.subject }}"
          allowUpdates: true
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}
