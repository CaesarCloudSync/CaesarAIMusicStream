name: Build Android APK

on:
  push:
    branches:
      - '*'
      - '**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - '*'
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Node.js v16
        uses: actions/setup-node@v4
        with:
          node-version: '16'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Determine Version Label
        id: version
        run: |
          REF_CLEAN=$(echo "${GITHUB_REF_NAME}" | sed 's/\//-/g')
          echo "label=${REF_CLEAN}" >> $GITHUB_OUTPUT

      - name: Build Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Rename APK with version label
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk \
             android/app/build/outputs/apk/release/CaesarAIMusic-${{ steps.version.outputs.label }}.apk

      - name: Get Commit Message
        id: commit_info
        run: |
          echo "subject=$(git log -1 --format=%s)" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact (CI)
        uses: actions/upload-artifact@v4
        with:
          name: CaesarAIMusic-${{ steps.version.outputs.label }}
          path: android/app/build/outputs/apk/release/CaesarAIMusic-${{ steps.version.outputs.label }}.apk
          if-no-files-found: error

      - name: Publish to GitHub Releases (Tags)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: ncipollo/release-action@v1
        with:
          artifacts: "android/app/build/outputs/apk/release/CaesarAIMusic-${{ steps.version.outputs.label }}.apk"
          tag: ${{ steps.version.outputs.label }}
          name: "CaesarAIMusicStream ${{ steps.version.outputs.label }}"
          body: |
            **Tag:** ${{ steps.version.outputs.label }}
            **Commit:** ${{ steps.commit_info.outputs.subject }}
          allowUpdates: true
          makeLatest: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub Releases (Branches)
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        uses: ncipollo/release-action@v1
        with:
          artifacts: "android/app/build/outputs/apk/release/CaesarAIMusic-${{ steps.version.outputs.label }}.apk"
          tag: ${{ steps.version.outputs.label }}
          name: "CaesarAIMusicStream ${{ steps.version.outputs.label }}"
          body: |
            **Branch:** ${{ github.ref_name }}
            **Commit:** ${{ steps.commit_info.outputs.subject }}
          allowUpdates: true
          makeLatest: ${{ github.ref_name == 'main' }}
          token: ${{ secrets.GITHUB_TOKEN }}
